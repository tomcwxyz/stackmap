name: Dependency audit

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/security-audit.yml
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install exactly the lockfile
        run: npm ci
      - name: Audit production and full dependency graphs
        run: |
          npm audit --json > audit-full.json || true
          npm audit --omit=dev --json > audit-production.json || true
          node scripts/security-audit-report.mjs audit-full.json audit-production.json
      - name: Enforce no moderate or worse npm advisories
        run: |
          npm audit --audit-level=moderate
          npm audit --omit=dev --audit-level=moderate
      - name: Retain complete audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: |
            audit-full.json
            audit-production.json
          retention-days: 30
