name: Regenerate security lockfile

on:
  push:
    branches: [fix/dependency-security-2026-10]

permissions:
  contents: write

jobs:
  update-lock:
    if: "startsWith(github.event.head_commit.message, 'security(upgrade):')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dependency-security-2026-10
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Resolve declared upgrades without running install scripts
        run: |
          # Re-resolve from the declared top-level versions: npm 10's Arborist
          # cannot reconcile this old Next 14 graph with Next 16 in-place.
          npm install --global npm@11
          rm package-lock.json
          if ! npm install --package-lock-only --ignore-scripts --no-audit --no-fund; then
            tail -120 "$(ls -t "$HOME"/.npm/_logs/*-debug-0.log | head -1)"
            exit 1
          fi
          npm audit fix --package-lock-only --ignore-scripts --no-fund || true
      - name: Commit lockfile on dedicated security branch
        run: |
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'Lockfile already matches updated dependency graph.'
          else
            git commit -m 'chore(lock): regenerate security dependency graph'
            git push origin HEAD:refs/heads/fix/dependency-security-2026-10
          fi
